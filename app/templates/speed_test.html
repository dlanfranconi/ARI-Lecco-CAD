{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>{{ t.speed_test }}</h1>
  <p class="meta">{{ t.speed_test_hint }}</p>
  <button id="speedtest-run" type="button">{{ t.run_test }}</button>
  <div class="speedtest-results">
    <div class="speedtest-metric"><span class="speedtest-label">{{ t.download }}</span><span class="speedtest-value" id="speedtest-download">—</span></div>
    <div class="speedtest-metric"><span class="speedtest-label">{{ t.upload }}</span><span class="speedtest-value" id="speedtest-upload">—</span></div>
    <div class="speedtest-metric"><span class="speedtest-label">{{ t.latency }}</span><span class="speedtest-value" id="speedtest-latency">—</span></div>
  </div>
  <p class="error" id="speedtest-error"></p>
</section>
{% endblock %}
{% block scripts %}
<script>window.CAD_LABELS = {{ t|tojson }};</script>
<script src="/static/speed-test.js"></script>
{% endblock %}
