{% extends "base.html" %}
{% block title %}{{ t.change_password }} - {{ t.app_title }}{% endblock %}
{% block content %}
<section class="login">
  <form method="post" action="/change-password" class="panel narrow">
    <h1>{{ t.change_password }}</h1>
    {% if required %}<p class="meta">{{ t.change_password_required }}</p>{% endif %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>{{ t.current_password }}<input name="current_password" type="password" autofocus required></label>
    <label>{{ t.new_password }}<input name="new_password" type="password" minlength="8" required></label>
    <label>{{ t.confirm_password }}<input name="confirm_password" type="password" minlength="8" required></label>
    <button>{{ t.change_password }}</button>
  </form>
</section>
{% endblock %}
