services:
  cad:
    build: .
    container_name: ari-lecco-cad
    restart: unless-stopped
    # Host networking so mDNS (ari-cad.local) can reach the LAN — multicast
    # doesn't cross Docker's default bridge network. Requires a Linux Docker
    # host and the PORT below free on it. Set MDNS_ENABLED=false and switch
    # back to a `ports:` mapping if you don't want this.
    network_mode: host
    environment:
      CAD_ADMIN_USERNAME: ${CAD_ADMIN_USERNAME:-dispatch}
      CAD_ADMIN_PASSWORD: ${CAD_ADMIN_PASSWORD:-dispatch}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-string}
      APRSFI_API_KEY: ${APRSFI_API_KEY:-}
      APRS_POLL_SECONDS: ${APRS_POLL_SECONDS:-60}
      DATABASE_PATH: /data/cad.sqlite3
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-ari-cad}
      # 80 so the app is reachable with no port in the URL (http://ari-cad.local).
      # The container runs as root, so binding to this privileged port is fine.
      # Change if something else on the host already uses 80.
      PORT: ${PORT:-80}
      # Optional: also serve HTTPS with a self-signed cert (auto-generated on
      # first start, persisted in the data volume). Off by default — browsers
      # and the app will show a one-time "not trusted" warning until you
      # explicitly trust it, since it's not from a public CA.
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NETWORK_MONITOR_ENABLED: ${NETWORK_MONITOR_ENABLED:-true}
    volumes:
      - ./data:/data
