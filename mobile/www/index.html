<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARI Lecco CAD</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #071012; color: #f8fbfb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .panel { width: min(420px, 100%); }
    h1 { font-size: 22px; margin: 0 0 6px; color: #8bd3ce; }
    p.sub { margin: 0 0 28px; color: #b7c7c9; font-size: 14px; }
    label { display: block; font-size: 13px; color: #b7c7c9; margin-bottom: 6px; }
    input {
      width: 100%; font-size: 16px; padding: 12px 14px; border-radius: 8px;
      border: 1px solid #46666d; background: #102a2f; color: #f8fbfb; margin-bottom: 16px;
    }
    input:focus { outline: 2px solid #8bd3ce; }
    button {
      width: 100%; font-size: 16px; font-weight: 700; padding: 13px; border-radius: 8px;
      border: none; background: #146c75; color: #f8fbfb; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    button.secondary { background: transparent; border: 1px solid #46666d; color: #b7c7c9; margin-top: 10px; }
    .error { color: #ff8a80; font-size: 13px; margin: -8px 0 16px; min-height: 16px; }
    .hint { color: #6f8a8f; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>ARI Lecco CAD</h1>
    <p class="sub">Enter the dispatch server name to connect on this network.</p>
    <form id="connect-form">
      <label for="server">Server name or address</label>
      <input id="server" name="server" placeholder="ari-cad.local" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <div class="error" id="error"></div>
      <button id="connect-btn" type="submit">Connect</button>
      <button id="announcements-btn" type="button" class="secondary">View Announcements (no login)</button>
    </form>
    <p class="hint">Example: <code>ari-cad.local</code> or <code>192.168.1.50</code>. Ask your race dispatch admin if unsure.</p>
  </div>
  <script>
    const STORAGE_KEY = "cad-server-host";
    const form = document.getElementById("connect-form");
    const input = document.getElementById("server");
    const errorEl = document.getElementById("error");
    const button = document.getElementById("connect-btn");
    const announcementsButton = document.getElementById("announcements-btn");

    function normalizeHost(raw) {
      // No port suffix by default — the server listens on 80, so plain
      // "ari-cad.local" just works. Users can still type "host:port" for a
      // non-default setup.
      let value = raw.trim();
      value = value.replace(/^https?:\/\//i, "");
      value = value.replace(/\/+$/, "");
      return value || null;
    }

    // path: "/" goes into the logged-in app (or lands on /login if there's no
    // session). "/announcer" is public and login-free -- from here (no
    // session cookie yet) it always shows the generic speaker/broadcast
    // board; a station with its own login gets its personal routed view
    // automatically once signed in, via the same route.
    async function tryConnect(host, path, activeButton, busyLabel, idleLabel) {
      errorEl.textContent = "";
      activeButton.disabled = true;
      activeButton.textContent = busyLabel;
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        await fetch(`http://${host}/login`, { method: "GET", mode: "no-cors", signal: controller.signal });
        clearTimeout(timeout);
        localStorage.setItem(STORAGE_KEY, host);
        window.location.href = `http://${host}${path}`;
      } catch (err) {
        errorEl.textContent = "Could not reach that server. Check the name and that you're on the race network.";
        activeButton.disabled = false;
        activeButton.textContent = idleLabel;
      }
    }

    // Pre-fill but don't auto-navigate -- this screen is also how you reach
    // "View Announcements," so it needs to actually stay visible instead of
    // immediately jumping to "/" (and from there to /login) the moment a
    // host is remembered from a previous connect.
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) input.value = saved;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const host = normalizeHost(input.value);
      if (!host) {
        errorEl.textContent = "Enter a server name or address.";
        return;
      }
      tryConnect(host, "/", button, "Connecting...", "Connect");
    });

    announcementsButton.addEventListener("click", () => {
      const host = normalizeHost(input.value);
      if (!host) {
        errorEl.textContent = "Enter a server name or address.";
        return;
      }
      tryConnect(host, "/announcer", announcementsButton, "Connecting...", "View Announcements (no login)");
    });
  </script>
</body>
</html>
