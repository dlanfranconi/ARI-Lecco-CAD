name: Build Docker image

on:
  push:
    branches: ["main", "WIP"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/dlanfranconi/ari-lecco-cad

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=wip,enable=${{ github.ref == 'refs/heads/WIP' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # arm64 so this image can actually run on a Raspberry Pi (built
          # via QEMU emulation above, since the runner itself is amd64) --
          # amd64 stays for local/VM deployments like the Portainer hosts.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-android:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Capacitor deps and sync Android project
        # cap sync generates mobile/android/capacitor-cordova-android-plugins/
        # (gitignored, not committed) -- the Gradle build fails without it.
        working-directory: mobile
        run: |
          npm install
          npx cap sync android

      - name: Build debug APK
        # Sideloaded internal tool, not Play Store distribution -- a
        # debug-signed APK installs fine and avoids standing up release
        # keystore secrets for a low-stakes internal app.
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-pi-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r pi-setup/build-requirements.txt

      - name: Build Pi image
        run: |
          python3 pi-setup/build-pi-image.py \
            --output "dist/ari-lecco-cad-pi-${{ github.ref_name }}.img.xz"

      - name: Upload Pi image artifact
        uses: actions/upload-artifact@v7
        with:
          name: pi-image
          path: dist/ari-lecco-cad-pi-${{ github.ref_name }}.img.xz

  release:
    needs: [build, build-android, build-pi-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Package pi-setup bundle
        run: |
          mkdir -p dist
          zip -r "dist/ari-lecco-cad-pi-setup-${{ github.ref_name }}.zip" pi-setup

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist

      - name: Download Pi image artifact
        uses: actions/download-artifact@v8
        with:
          name: pi-image
          path: dist

      - name: Rename APK with version
        run: mv dist/app-debug.apk "dist/ari-lecco-cad-${{ github.ref_name }}.apk"

      # Only ever creates the release asset for a tag that's already been
      # pushed -- this workflow never pushes tags itself, and pushing a
      # version tag is a manual, explicit step, never automated.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/ari-lecco-cad-pi-setup-${{ github.ref_name }}.zip" \
            "pi-setup/bootstrap.sh" \
            "dist/ari-lecco-cad-${{ github.ref_name }}.apk" \
            "dist/ari-lecco-cad-pi-${{ github.ref_name }}.img.xz" \
            --title "${{ github.ref_name }}" \
            --generate-notes
